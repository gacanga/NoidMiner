# NoidMiner - ParanO(1)d (NOID) on the InnovLab pool (Stratum over TLS)
# Pools in failover order
pool = stratum+ssl://eu2.innovlab.cc:19601
pool = stratum+ssl://eu.innovlab.cc:19601
pool = stratum+ssl://stratum.innovlab.cc:19601
# payout address . rig name
user = YOUR_NOID_ADDRESS.rig1
pass = x
# GPUs: all, or a list like 0,1,2 (PCI bus order, as nvidia-smi)
gpus = all
# engine: table (fastest on P104-100), tower or kop
mode = table
# threads per block: 256, 384 or 512 (512 is fastest on P104-100)
tpb = 512
# nonces per thread per scan: 0 = automatic (each scan ~target-ms)
npt = 0
target-ms = 200
# summary line every N seconds
stats = 30
